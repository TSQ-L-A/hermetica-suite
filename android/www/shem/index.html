<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#dcd4c3" />
  <title>Shem HaMephorash</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header id="header">
    <span id="relogio">00:00:00</span>
    <span id="app-title">שם SHEM HAMEPHORASH</span>
    <div id="header-right">
      <button id="btn-cidade">📍 —</button>
      <button id="btn-hub">Menu</button>
    </div>
  </header>

  <!-- ── Main (scroll) ── -->
  <div id="main">

    <!-- ── Anjo do momento ── -->
    <section id="painel-atual">

      <div class="painel-section-title">Anjo do Momento · Ascendente</div>

      <div id="bloco-planeta">
        <span id="painel-heb" dir="rtl" lang="he">—</span>
        <div id="painel-info-texto">
          <span id="painel-nome">—</span>
          <span id="painel-num">—</span>
          <span id="painel-intervalo">—</span>
        </div>
      </div>

      <div id="bloco-extras">
        <div class="bloco-extra">
          <div class="bloco-label">Anjo dos Dias · Sol</div>
          <div id="painel-sol">—</div>
        </div>
        <div class="bloco-extra">
          <div class="bloco-label">Próximo Anjo</div>
          <div id="painel-prox">—</div>
        </div>
      </div>

      <div id="painel-carta">—</div>

    </section>

    <!-- ── Listagem do dia ── -->
    <section id="painel-tabela">

      <div id="tabela-header">
        <div id="tabela-esq">
          <span id="tabela-titulo">Anjos do Dia</span>
          <button class="btn-dia" id="btn-lista" title="Ficha de qualquer anjo">Os 72</button>
        </div>
        <div id="tabela-nav">
          <button class="btn-dia" id="btn-hoje">Hoje</button>
          <button class="btn-dia" id="btn-dia-ant">◀</button>
          <span id="tabela-dia">—</span>
          <button class="btn-dia" id="btn-dia-prox">▶</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th class="col-num">#</th>
            <th class="col-inicio">Início</th>
            <th class="col-fim">Fim</th>
            <th>Anjo</th>
          </tr>
        </thead>
        <tbody id="tabela-body"></tbody>
      </table>

    </section>

  </div><!-- /main -->

  <!-- ── Modal de Cidade ── -->
  <div id="modal-cidade">
    <div id="modal-overlay"></div>
    <div id="modal-box">
      <div id="modal-topo">
        <span id="modal-titulo">Selecionar Localização</span>
        <button id="btn-modal-fechar">✕</button>
      </div>
      <div id="modal-busca">
        <input id="input-cidade" type="text" placeholder="Digite o nome da cidade…" autocomplete="off" />
      </div>
      <div id="lista-cidades"></div>
    </div>
  </div>

  <!-- ── Ficha do anjo / lista dos 72 ── -->
  <div id="modal-ficha">
    <div id="ficha-overlay"></div>
    <div id="ficha-box">
      <div id="ficha-topo-barra">
        <span id="ficha-titulo">—</span>
        <button id="btn-ficha-fechar">✕</button>
      </div>
      <div id="ficha-corpo"></div>
    </div>
  </div>

  <script src="dados.js"></script>
  <script src="shem.js"></script>
</body>
</html>
