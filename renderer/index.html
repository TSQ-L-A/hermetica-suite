<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Hermetica</title>
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <header id="header">
    <span id="app-title">✦ HERMETICA</span>
    <button id="btn-close">✕</button>
  </header>

  <main id="hub">
    <p id="hub-sub">Selecione um módulo</p>

    <div id="cards">

      <button class="card" data-app="astra" data-page="astra/index.html">
        <span class="card-sym">☉</span>
        <span><span class="card-name">Astra Hermetica</span><span class="card-desc">Mapa astral em tempo real e eletivo</span></span>
      </button>

      <button class="card" data-app="geomantia" data-page="geomantia/index.html">
        <span class="card-sym">⬡</span>
        <span><span class="card-name">Geomantia Hermetica</span><span class="card-desc">Geração e leitura de mapas geománticos</span></span>
      </button>

      <button class="card" data-app="horae" data-page="horae/index.html">
        <span class="card-sym">♄</span>
        <span><span class="card-name">Horae Hermetica</span><span class="card-desc">Horas planetárias e ciclos do dia</span></span>
      </button>

      <button class="card" data-app="shem" data-page="shem/index.html">
        <span class="card-sym">ש</span>
        <span><span class="card-name">Shem HaMephorash</span><span class="card-desc">Os 72 anjos do momento e dos dias</span></span>
      </button>

      <button class="card" data-app="tattvas" data-page="tattvas/index.html">
        <span class="card-sym">△</span>
        <span><span class="card-name">Tattvas</span><span class="card-desc">Marés tattvicas do dia</span></span>
      </button>

    </div>
  </main>

  <script src="hub.js"></script>
</body>
</html>
